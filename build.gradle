plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

repositories {
    maven {name = "Fuzs Mod Resources"; url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"}
    maven {name = "TerraformersMC"; url = "https://maven.terraformersmc.com/"}
    maven {name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org'}
    maven {name = "TerraformersMC"; url = "https://maven.terraformersmc.com/"}
    maven {name = "Ladysnake Libs"; url = 'https://maven.ladysnake.org/releases'}
    maven {name = "Modrinth"; url = "https://api.modrinth.com/maven"}
    maven {name = "AzureDoom Mods"; url = "https://maven.azuredoom.com/mods"}
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forgeconfigapi_version}"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
    modImplementation "mod.azure.azurelib:azurelib-fabric-1.20.1:3.0.8"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "maven.modrinth:ears:1.4.7+fabric-1.20"
}

processResources {
    filteringCharset "UTF-8"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(17)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(17)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}